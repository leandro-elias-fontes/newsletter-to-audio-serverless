[project]
name = "newsletter-to-audio-serverless"
version = "0.1.0"
description = "Automação serverless R$ 0,00 que filtra newsletters no Gmail com Gemini 2.5 Flash, gera roteiro de podcast em PT-BR e envia áudio via edge-tts no Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "edge-tts>=6.1.12",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "google-genai>=0.5.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
